input {
  beats {
    port => 5044
  }
}

filter {
  if [container][name] {
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
  }

  if [message] =~ /ERROR/ {
    mutate {
      add_tag => ["error"]
    }
  }

  if [message] =~ /WARNING/ {
    mutate {
      add_tag => ["warning"]
    }
  }

  if [message] =~ /INFO/ {
    mutate {
      add_tag => ["info"]
    }
  }

  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    remove_field => ["host", "agent", "ecs", "log"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "learning-agent-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}