<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>学习评估与巩固智能体</title>
    <style>
      :root {
        --bg: #f5f1e8;
        --ink: #2a241f;
        --accent: #c36a2d;
        --paper: #fff8f0;
        --muted: #8c7b6f;
        --ok: #1f7a4c;
        --bad: #b12b2b;
        --shadow: 0 14px 30px rgba(0,0,0,0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "STSong", "SimSun", "Noto Serif SC", serif;
        background:
          radial-gradient(circle at 12% 8%, #fde3c2, #f5f1e8 60%),
          linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0));
        color: var(--ink);
      }
      header {
        padding: 24px 32px;
        background: linear-gradient(120deg, #f8d7a8, #f3c893);
        border-bottom: 2px solid #e7b57c;
      }
      h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 1px; }
      h2 { font-size: 18px; margin: 0 0 10px; }
      h3 { font-size: 15px; margin: 12px 0 6px; }
      p { margin: 0; color: var(--muted); }
      main {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 20px;
        padding: 24px 32px 40px;
      }
      section {
        background: var(--paper);
        border: 1px solid #e7d5c3;
        border-radius: 12px;
        padding: 16px 18px;
        box-shadow: var(--shadow);
      }
      label { display: block; margin: 10px 0 6px; }
      input[type="file"],
      input[type="text"],
      textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #d6c3b2;
        border-radius: 6px;
        background: #fff;
      }
      textarea { min-height: 80px; }
      button {
        margin-top: 10px;
        padding: 8px 12px;
        border: none;
        background: var(--accent);
        color: white;
        border-radius: 6px;
        cursor: pointer;
        transition: transform 0.08s ease, box-shadow 0.2s ease;
        box-shadow: 0 6px 14px rgba(195,106,45,0.25);
      }
      button:hover { transform: translateY(-1px); }
      button:disabled { background: #c9a48d; cursor: not-allowed; }
      .status { margin-top: 8px; color: var(--muted); font-size: 13px; }
      .question-card {
        margin: 12px 0;
        padding: 10px;
        border: 1px dashed #d7c6b5;
        border-radius: 10px;
        background: #fffdf9;
      }
      .score {
        font-weight: bold;
        color: #7a3e00;
      }
      .tag {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 12px;
        margin-left: 6px;
      }
      .tag.right { background: #d9f4e3; color: var(--ok); }
      .tag.wrong { background: #fde2e2; color: var(--bad); }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        background: #f1e3d6;
        margin-right: 6px;
      }
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #d4b79b;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 6px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error {
        margin-top: 8px;
        padding: 8px;
        border: 1px solid #f2b5b5;
        background: #fdeaea;
        border-radius: 6px;
        color: #7a1d1d;
        display: none;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 980px) {
        main { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>学习评估与巩固智能体</h1>
      <p>上传教材 → 自动出题 → 作答判卷 → 错题本</p>
    </header>
    <main>
      <section>
        <h2>流程区</h2>
        <h3>1. 上传 PDF</h3>
        <input id="pdfFile" type="file" accept=".pdf" />
        <button id="uploadBtn">上传并解析</button>
        <div class="status" id="uploadStatus">未上传</div>
        <div class="status" id="sessionInfo">会话 ID：未生成</div>
        <div class="error" id="uploadError"></div>
        <button id="refreshSessionsBtn" style="margin-top:6px;">刷新会话列表</button>
        <div class="status" id="sessionListStatus">暂无会话</div>
        <div id="sessionList"></div>

        <h3 style="margin-top:16px;">2. 生成题目</h3>
        <div class="grid">
          <div>
            <label>选择题数量</label>
            <input id="mcqCount" type="text" value="3" />
          </div>
          <div>
            <label>简答题数量</label>
            <input id="saCount" type="text" value="2" />
          </div>
        </div>
        <button id="genBtn" disabled>生成题目</button>
        <div class="status" id="genStatus">等待会话</div>
        <div class="error" id="genError"></div>

        <h3 style="margin-top:16px;">3. 作答与判卷</h3>
        <button id="gradeBtn" disabled>提交判卷</button>
        <button id="resetBtn" style="margin-left:6px;">一键重置</button>
        <div class="status" id="gradeStatus">等待题目</div>
        <div class="error" id="gradeError"></div>
      </section>

      <section>
        <h2>结果区</h2>
        <h3>题目列表</h3>
        <div id="questions"></div>

        <h3 style="margin-top:16px;">判卷结果</h3>
        <div id="gradeResult"></div>

        <h3 style="margin-top:16px;">错题本</h3>
        <button id="wrongbookBtn" disabled>刷新错题本</button>
        <button id="recordBtn" disabled style="margin-left:6px;">查看最近作答</button>
        <div id="wrongbook"></div>
        <div id="records"></div>
      </section>
    </main>

    <script>
      const state = {
        sessionId: "",
        questions: []
      };

      const uploadBtn = document.getElementById("uploadBtn");
      const genBtn = document.getElementById("genBtn");
      const gradeBtn = document.getElementById("gradeBtn");
      const wrongbookBtn = document.getElementById("wrongbookBtn");
      const recordBtn = document.getElementById("recordBtn");
      const resetBtn = document.getElementById("resetBtn");
      const refreshSessionsBtn = document.getElementById("refreshSessionsBtn");
      const uploadStatus = document.getElementById("uploadStatus");
      const sessionInfo = document.getElementById("sessionInfo");
      const uploadError = document.getElementById("uploadError");
      const sessionListStatus = document.getElementById("sessionListStatus");
      const sessionListDiv = document.getElementById("sessionList");
      const genStatus = document.getElementById("genStatus");
      const genError = document.getElementById("genError");
      const gradeStatus = document.getElementById("gradeStatus");
      const gradeError = document.getElementById("gradeError");
      const questionsDiv = document.getElementById("questions");
      const gradeResult = document.getElementById("gradeResult");
      const wrongbookDiv = document.getElementById("wrongbook");
      const recordsDiv = document.getElementById("records");

      uploadBtn.onclick = async () => {
        uploadError.style.display = "none";
        const file = document.getElementById("pdfFile").files[0];
        if (!file) {
          uploadStatus.textContent = "请选择 PDF 文件";
          return;
        }
        uploadBtn.disabled = true;
        uploadStatus.innerHTML = `<span class="spinner"></span>上传中...`;
        const form = new FormData();
        form.append("file", file);
        const res = await fetch("/sessions", { method: "POST", body: form });
        if (!res.ok) {
          uploadStatus.textContent = "上传失败";
          uploadError.textContent = "上传或解析失败，请检查 PDF。";
          uploadError.style.display = "block";
          uploadBtn.disabled = false;
          return;
        }
        const data = await res.json();
        state.sessionId = data.session_id;
        uploadStatus.textContent = `会话创建成功，切分数：${data.chunk_count}`;
        sessionInfo.textContent = `会话 ID：${state.sessionId}`;
        genBtn.disabled = false;
        wrongbookBtn.disabled = false;
        recordBtn.disabled = false;
        uploadBtn.disabled = false;
        fetchSessions();
      };

      genBtn.onclick = async () => {
        genError.style.display = "none";
        genStatus.innerHTML = `<span class="spinner"></span>生成中...`;
        genBtn.disabled = true;
        const body = {
          session_id: state.sessionId,
          num_mcq: Number(document.getElementById("mcqCount").value || 3),
          num_short: Number(document.getElementById("saCount").value || 2)
        };
        const res = await fetch("/questions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          genStatus.textContent = "生成失败";
          genError.textContent = "题目生成失败，请稍后重试。";
          genError.style.display = "block";
          genBtn.disabled = false;
          return;
        }
        const data = await res.json();
        state.questions = data.questions;
        genStatus.textContent = "生成完成";
        renderQuestions();
        gradeBtn.disabled = false;
        genBtn.disabled = false;
      };

      function renderQuestions() {
        questionsDiv.innerHTML = "";
        state.questions.forEach((q, idx) => {
          const card = document.createElement("div");
          card.className = "question-card";
          card.innerHTML = `<div><strong>Q${idx + 1} (${q.qtype})</strong> ${q.question}</div>`;
          if (q.options) {
            const optList = q.options.map(o => `<div>${o}</div>`).join("");
            card.innerHTML += `<div style="margin-top:6px;">${optList}</div>`;
          }
          card.innerHTML += `<label>你的答案</label>`;
          if (q.qtype === "short_answer") {
            card.innerHTML += `<textarea data-qid="${q.qid}"></textarea>`;
          } else {
            card.innerHTML += `<input type="text" data-qid="${q.qid}" placeholder="例如：A" />`;
          }
          questionsDiv.appendChild(card);
        });
      }

      gradeBtn.onclick = async () => {
        gradeError.style.display = "none";
        gradeStatus.innerHTML = `<span class="spinner"></span>判卷中...`;
        gradeBtn.disabled = true;
        const answers = [];
        document.querySelectorAll("[data-qid]").forEach((el) => {
          answers.push({ qid: el.getAttribute("data-qid"), answer: el.value });
        });
        const body = {
          session_id: state.sessionId,
          questions: state.questions,
          answers: answers
        };
        const res = await fetch("/grade", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          gradeStatus.textContent = "判卷失败";
          gradeError.textContent = "判卷失败，请检查答案或稍后重试。";
          gradeError.style.display = "block";
          gradeBtn.disabled = false;
          return;
        }
        const data = await res.json();
        gradeStatus.textContent = "判卷完成";
        const correctCount = data.items.filter(i => i.is_correct).length;
        const totalCount = data.items.length;
        gradeResult.innerHTML = `<div class="score">总分：${data.total_score} / ${totalCount * 2}</div>
                                 <div>正确题数：${correctCount} / ${totalCount}</div>`;
        data.items.forEach((i) => {
          const div = document.createElement("div");
          div.className = "question-card";
          div.innerHTML = `<div><strong>${i.qid}</strong>
                             <span class="tag ${i.is_correct ? "right" : "wrong"}">
                               ${i.is_correct ? "正确" : "错误"}
                             </span>
                             得分 ${i.score}
                           </div>
                           <div>解析：${i.explanation}</div>`;
          gradeResult.appendChild(div);
        });
        gradeResult.scrollIntoView({ behavior: "smooth" });
        gradeBtn.disabled = false;
      };

      wrongbookBtn.onclick = async () => {
        if (!state.sessionId) return;
        const res = await fetch(`/wrongbook/${state.sessionId}`);
        if (!res.ok) {
          wrongbookDiv.textContent = "查询失败";
          return;
        }
        const data = await res.json();
        const summary = data.summary || { total: 0, by_keyword: {} };
        const summaryList = Object.entries(summary.by_keyword || {})
          .map(([k, v]) => `<span class="pill">${k}：${v}</span>`)
          .join("");
        const suggestion = summary.total > 0
          ? "建议优先复习错题关键词对应的章节，并再次完成同类题目。"
          : "当前无错题，建议继续提升题量或提高难度。";
        wrongbookDiv.innerHTML = `<div>错题数：${data.total_wrong}</div>
                                  <div style="margin-top:6px;">关键词统计：</div>
                                  <div>${summaryList || "暂无统计"}</div>
                                  <div style="margin-top:6px;">建议：${suggestion}</div>`;
        data.items.forEach((w) => {
          const div = document.createElement("div");
          div.className = "question-card";
          div.innerHTML = `<div><strong>${w.qid}</strong> ${w.question}</div>
                           <div>你的答案：${w.user_answer}</div>
                           <div>正确答案：${w.correct_answer}</div>
                           <div>解析：${w.explanation}</div>`;
          wrongbookDiv.appendChild(div);
        });
        wrongbookDiv.scrollIntoView({ behavior: "smooth" });
      };

      recordBtn.onclick = async () => {
        if (!state.sessionId) return;
        const res = await fetch(`/records/${state.sessionId}`);
        if (!res.ok) {
          recordsDiv.textContent = "作答记录获取失败";
          return;
        }
        const data = await res.json();
        recordsDiv.innerHTML = `<div style="margin-top:8px;">最近作答记录</div>`;
        if (!data.questions || data.questions.length === 0) {
          recordsDiv.innerHTML += `<div>暂无题目记录</div>`;
          return;
        }
        data.questions.forEach((q) => {
          const ans = (data.answers || []).find(a => a.qid === q.qid);
          const div = document.createElement("div");
          div.className = "question-card";
          div.innerHTML = `<div><strong>${q.qid}</strong> ${q.question}</div>
                           <div>你的答案：${ans ? ans.answer : "未作答"}</div>
                           <div>参考答案：${q.answer}</div>`;
          recordsDiv.appendChild(div);
        });
        recordsDiv.scrollIntoView({ behavior: "smooth" });
      };

      resetBtn.onclick = () => {
        state.sessionId = "";
        state.questions = [];
        document.getElementById("pdfFile").value = "";
        uploadStatus.textContent = "未上传";
        sessionInfo.textContent = "会话 ID：未生成";
        genStatus.textContent = "等待会话";
        gradeStatus.textContent = "等待题目";
        questionsDiv.innerHTML = "";
        gradeResult.innerHTML = "";
        wrongbookDiv.innerHTML = "";
        genBtn.disabled = true;
        gradeBtn.disabled = true;
        wrongbookBtn.disabled = true;
        recordBtn.disabled = true;
        recordsDiv.innerHTML = "";
      };

      async function fetchSessions() {
        sessionListStatus.innerHTML = `<span class="spinner"></span>加载会话列表...`;
        sessionListDiv.innerHTML = "";
        const res = await fetch("/sessions");
        if (!res.ok) {
          sessionListStatus.textContent = "会话列表获取失败";
          return;
        }
        const data = await res.json();
        if (!data.sessions || data.sessions.length === 0) {
          sessionListStatus.textContent = "暂无会话";
          return;
        }
        sessionListStatus.textContent = `共 ${data.sessions.length} 个会话`;
        data.sessions.forEach((s) => {
          const div = document.createElement("div");
          div.className = "question-card";
          div.innerHTML = `<div><strong>${s.session_id}</strong></div>
                           <div>切分数：${s.chunk_count}</div>
                           <div>创建时间：${s.created_at}</div>
                           <button data-del="${s.session_id}">删除会话</button>`;
          sessionListDiv.appendChild(div);
        });
        document.querySelectorAll("[data-del]").forEach((btn) => {
          btn.onclick = async (e) => {
            const id = e.target.getAttribute("data-del");
            await fetch(`/sessions/${id}`, { method: "DELETE" });
            if (state.sessionId === id) {
              resetBtn.onclick();
            }
            fetchSessions();
          };
        });
      }

      refreshSessionsBtn.onclick = fetchSessions;
    </script>
  </body>
</html>
