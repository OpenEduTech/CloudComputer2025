<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>学习评估与巩固智能体</title>
    <style>
      :root {
        --bg: #f5f1e8;
        --ink: #2a241f;
        --accent: #c36a2d;
        --paper: #fff8f0;
        --muted: #8c7b6f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "STSong", "SimSun", "Noto Serif SC", serif;
        background: radial-gradient(circle at 10% 10%, #fde3c2, #f5f1e8);
        color: var(--ink);
      }
      header {
        padding: 24px 32px;
        background: linear-gradient(120deg, #f8d7a8, #f3c893);
        border-bottom: 2px solid #e7b57c;
      }
      h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 1px; }
      p { margin: 0; color: var(--muted); }
      main {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 20px;
        padding: 24px 32px 40px;
      }
      section {
        background: var(--paper);
        border: 1px solid #e7d5c3;
        border-radius: 12px;
        padding: 16px 18px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      }
      section h2 { margin: 0 0 10px; font-size: 18px; }
      label { display: block; margin: 10px 0 6px; }
      input[type="file"],
      input[type="text"],
      textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #d6c3b2;
        border-radius: 6px;
        background: #fff;
      }
      textarea { min-height: 80px; }
      button {
        margin-top: 10px;
        padding: 8px 12px;
        border: none;
        background: var(--accent);
        color: white;
        border-radius: 6px;
        cursor: pointer;
      }
      button:disabled { background: #c9a48d; cursor: not-allowed; }
      .status { margin-top: 8px; color: var(--muted); font-size: 13px; }
      .question-card {
        margin: 12px 0;
        padding: 10px;
        border: 1px dashed #d7c6b5;
        border-radius: 10px;
        background: #fffdf9;
      }
      .score {
        font-weight: bold;
        color: #7a3e00;
      }
      .tag {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 12px;
        margin-left: 6px;
      }
      .tag.right { background: #e2f6e2; color: #1d5f2c; }
      .tag.wrong { background: #fde2e2; color: #7a1d1d; }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 980px) {
        main { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>学习评估与巩固智能体</h1>
      <p>上传教材 → 自动出题 → 作答判卷 → 错题本</p>
    </header>
    <main>
      <section>
        <h2>1. 上传 PDF</h2>
        <input id="pdfFile" type="file" accept=".pdf" />
        <button id="uploadBtn">上传并解析</button>
        <div class="status" id="uploadStatus">未上传</div>

        <h2 style="margin-top:16px;">2. 生成题目</h2>
        <div class="grid">
          <div>
            <label>选择题数量</label>
            <input id="mcqCount" type="text" value="3" />
          </div>
          <div>
            <label>简答题数量</label>
            <input id="saCount" type="text" value="2" />
          </div>
        </div>
        <button id="genBtn" disabled>生成题目</button>
        <div class="status" id="genStatus">等待会话</div>
      </section>

      <section>
        <h2>3. 作答与判卷</h2>
        <div id="questions"></div>
        <button id="gradeBtn" disabled>提交判卷</button>
        <div class="status" id="gradeStatus">等待题目</div>
        <div id="gradeResult"></div>

        <h2 style="margin-top:16px;">4. 错题本</h2>
        <button id="wrongbookBtn" disabled>刷新错题本</button>
        <div id="wrongbook"></div>
      </section>
    </main>

    <script>
      const state = {
        sessionId: "",
        questions: []
      };

      const uploadBtn = document.getElementById("uploadBtn");
      const genBtn = document.getElementById("genBtn");
      const gradeBtn = document.getElementById("gradeBtn");
      const wrongbookBtn = document.getElementById("wrongbookBtn");
      const uploadStatus = document.getElementById("uploadStatus");
      const genStatus = document.getElementById("genStatus");
      const gradeStatus = document.getElementById("gradeStatus");
      const questionsDiv = document.getElementById("questions");
      const gradeResult = document.getElementById("gradeResult");
      const wrongbookDiv = document.getElementById("wrongbook");

      uploadBtn.onclick = async () => {
        const file = document.getElementById("pdfFile").files[0];
        if (!file) {
          uploadStatus.textContent = "请选择 PDF 文件";
          return;
        }
        uploadBtn.disabled = true;
        uploadStatus.textContent = "上传中...";
        const form = new FormData();
        form.append("file", file);
        const res = await fetch("/sessions", { method: "POST", body: form });
        if (!res.ok) {
          uploadStatus.textContent = "上传失败";
          uploadBtn.disabled = false;
          return;
        }
        const data = await res.json();
        state.sessionId = data.session_id;
        uploadStatus.textContent = `会话创建成功，切分数：${data.chunk_count}`;
        genBtn.disabled = false;
        wrongbookBtn.disabled = false;
        uploadBtn.disabled = false;
      };

      genBtn.onclick = async () => {
        genStatus.textContent = "生成中...";
        genBtn.disabled = true;
        const body = {
          session_id: state.sessionId,
          num_mcq: Number(document.getElementById("mcqCount").value || 3),
          num_short: Number(document.getElementById("saCount").value || 2)
        };
        const res = await fetch("/questions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          genStatus.textContent = "生成失败";
          genBtn.disabled = false;
          return;
        }
        const data = await res.json();
        state.questions = data.questions;
        genStatus.textContent = "生成完成";
        renderQuestions();
        gradeBtn.disabled = false;
        genBtn.disabled = false;
      };

      function renderQuestions() {
        questionsDiv.innerHTML = "";
        state.questions.forEach((q, idx) => {
          const card = document.createElement("div");
          card.className = "question-card";
          card.innerHTML = `<div><strong>Q${idx + 1} (${q.qtype})</strong> ${q.question}</div>`;
          if (q.options) {
            const optList = q.options.map(o => `<div>${o}</div>`).join("");
            card.innerHTML += `<div style="margin-top:6px;">${optList}</div>`;
          }
          card.innerHTML += `<label>你的答案</label>`;
          if (q.qtype === "short_answer") {
            card.innerHTML += `<textarea data-qid="${q.qid}"></textarea>`;
          } else {
            card.innerHTML += `<input type="text" data-qid="${q.qid}" placeholder="例如：A" />`;
          }
          questionsDiv.appendChild(card);
        });
      }

      gradeBtn.onclick = async () => {
        gradeStatus.textContent = "判卷中...";
        gradeBtn.disabled = true;
        const answers = [];
        document.querySelectorAll("[data-qid]").forEach((el) => {
          answers.push({ qid: el.getAttribute("data-qid"), answer: el.value });
        });
        const body = {
          session_id: state.sessionId,
          questions: state.questions,
          answers: answers
        };
        const res = await fetch("/grade", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          gradeStatus.textContent = "判卷失败";
          gradeBtn.disabled = false;
          return;
        }
        const data = await res.json();
        gradeStatus.textContent = "判卷完成";
        const correctCount = data.items.filter(i => i.is_correct).length;
        const totalCount = data.items.length;
        gradeResult.innerHTML = `<div class="score">总分：${data.total_score} / ${totalCount * 2}</div>
                                 <div>正确题数：${correctCount} / ${totalCount}</div>`;
        data.items.forEach((i) => {
          const div = document.createElement("div");
          div.className = "question-card";
          div.innerHTML = `<div><strong>${i.qid}</strong>
                             <span class="tag ${i.is_correct ? "right" : "wrong"}">
                               ${i.is_correct ? "正确" : "错误"}
                             </span>
                             得分 ${i.score}
                           </div>
                           <div>解析：${i.explanation}</div>`;
          gradeResult.appendChild(div);
        });
        gradeBtn.disabled = false;
      };

      wrongbookBtn.onclick = async () => {
        if (!state.sessionId) return;
        const res = await fetch(`/wrongbook/${state.sessionId}`);
        if (!res.ok) {
          wrongbookDiv.textContent = "查询失败";
          return;
        }
        const data = await res.json();
        wrongbookDiv.innerHTML = `<div>错题数：${data.total_wrong}</div>`;
        data.items.forEach((w) => {
          const div = document.createElement("div");
          div.className = "question-card";
          div.innerHTML = `<div><strong>${w.qid}</strong> ${w.question}</div>
                           <div>你的答案：${w.user_answer}</div>
                           <div>正确答案：${w.correct_answer}</div>
                           <div>解析：${w.explanation}</div>`;
          wrongbookDiv.appendChild(div);
        });
      };
    </script>
  </body>
</html>
