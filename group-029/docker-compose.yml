services:
  api:
    build: .
    ports:
      - "8000:8000"
    # 通过环境变量注入 LLM 与 Redis 配置
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE}
      - REDIS_URL=${REDIS_URL}
      - USE_LANGGRAPH=${USE_LANGGRAPH}
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
