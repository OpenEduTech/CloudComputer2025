# 全局默认关闭etag（避免缓存干扰，可选但建议加）
etag off;

server {
    listen 80 default_server;  # 标记为默认服务器，确保所有80端口请求走这个配置
    server_name _;             # 匹配所有域名（包括127.0.0.1、localhost）
    root /usr/share/nginx/html;
    index index.html;

    # 核心规则：匹配所有/api/开头的请求（优先级最高）
    # 注意：location /api/ 结尾必须带/，proxy_pass结尾也必须带/
    location /api/ {
        # 转发到Docker内网的后端容器（backend是容器名，8000是后端端口）
        proxy_pass http://backend:8000/api/;
        
        # 强制重置请求头，避免Nginx吞掉请求信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置，避免请求卡死
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 禁止缓存/api请求（避免接口返回旧数据）
        proxy_cache_bypass $http_pragma;
        proxy_cache_revalidate on;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 处理Vue/React路由刷新404（优先级低于/api/）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 禁止访问隐藏文件（可选，增强安全性）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止Nginx记录静态文件的304日志（可选，减少日志冗余）
    location ~* \.(svg|js|css|png|jpg|jpeg|gif|ico)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }
}