services:
  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: kg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - kg-network
    restart: unless-stopped

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: kg-backend
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${MAAS_API_KEY:-8cd5dae3153741fdbd0f5d55b4cd8ac7.u99gIHy5WdBr0Caz}
      - OPENAI_API_BASE=${MAAS_API_ENDPOINT:-https://open.bigmodel.cn/api/paas/v4}
      - MODEL_NAME=${MAAS_MODEL_NAME:-glm-4}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - FLASK_ENV=production
    depends_on:
      - redis
    networks:
      - kg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:5000/health'); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: kg-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - kg-network
    restart: unless-stopped

networks:
  kg-network:
    driver: bridge

volumes:
  redis-data:

