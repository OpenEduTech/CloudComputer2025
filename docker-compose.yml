services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./storage:/app/storage
    environment:
      - MONGO_URI=mongodb://mongodb:27017/mydb
      - MONGO_DB_NAME=${MONGO_DB_NAME:-learning_agent}
      - REDIS_URL=redis://redis:6379
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - KIMI_MODEL=${KIMI_MODEL:-moonshot-v1-8k}
      - CONTEXT_MAX_CHARS=${CONTEXT_MAX_CHARS:-10000}
      - SUMMARY_MAX_CHARS=${SUMMARY_MAX_CHARS:-10000}
      - SUMMARY_CHUNK_CHARS=${SUMMARY_CHUNK_CHARS:-4000}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/storage/uploads}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - BACKEND_PORT=8000

  worker:
    build: ./worker
    container_name: worker
    depends_on:
      - backend
      - redis
      - mongodb
    volumes:
      - ./storage:/app/storage
    environment:
      - MONGO_URI=mongodb://mongodb:27017/mydb
      - MONGO_DB_NAME=${MONGO_DB_NAME:-learning_agent}
      - REDIS_URL=redis://redis:6379
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - KIMI_MODEL=${KIMI_MODEL:-moonshot-v1-8k}
      - CONTEXT_MAX_CHARS=${CONTEXT_MAX_CHARS:-10000}
      - SUMMARY_MAX_CHARS=${SUMMARY_MAX_CHARS:-10000}
      - SUMMARY_CHUNK_CHARS=${SUMMARY_CHUNK_CHARS:-4000}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL:-embedding-3}
      - EMBED_DIM=${EMBED_DIM:-0}
      - EMBED_MAX_CHARS=${EMBED_MAX_CHARS:-2000}
      - RAG_ENABLED=${RAG_ENABLED:-1}
      - RAG_TOP_K=${RAG_TOP_K:-6}
      - RAG_CONTEXT_MAX_CHARS=${RAG_CONTEXT_MAX_CHARS:-8000}
      - RAG_INDEX_DIR=${RAG_INDEX_DIR:-/app/storage/vector_index}
      - ZHIPU_EMBED_URL=${ZHIPU_EMBED_URL:-https://open.bigmodel.cn/api/paas/v4/embeddings}

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}

  redis:
    image: "redis:alpine"
    container_name: redis
    ports:
      - "6379:6379"

  mongodb:
    image: "mongo:latest"
    container_name: mongodb
    ports:
      - "27017:27017"
