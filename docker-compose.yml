services:
  # 1. 前端服务
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - autokgs-net

  # 2. 后端 API 服务
  backend:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    depends_on:
      - redis
      - neo4j
    networks:
      - autokgs-net

  # 3. 智能体 Worker 服务
  worker:
    build: ./agent_engine
    restart: always
    volumes:
      - ./agent_engine:/app
      - ./data:/app/data # 挂载数据目录以便导入
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_PORT=8000
      - EMBEDDING_MODEL=ecnu-embedding-small
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
    depends_on:
      - redis
      - chromadb
    networks:
      - autokgs-net

  # 4. 消息队列 Redis
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - autokgs-net

  # 5. 图数据库 Neo4j
  neo4j:
    image: neo4j:5.17.0
    restart: always
    ports:
      - "7474:7474" # HTTP Console
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - ./neo4j_data/data:/data
      - ./neo4j_data/logs:/logs
    networks:
      - autokgs-net

  # 6. 向量数据库 ChromaDB
  chromadb:
    image: chromadb/chroma:latest
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    networks:
      - autokgs-net

volumes:
  redis_data:
  chroma_data:

networks:
  autokgs-net:
    driver: bridge
