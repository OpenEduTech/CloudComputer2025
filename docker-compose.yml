services:
  neo4j:
    image: neo4j:5
    container_name: cc-neo4j
    ports:
      - "17474:7474"
      - "17687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

  backend:
    build: .
    container_name: cc-backend
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE}
      - MAX_EVIDENCE_QUERIES=${MAX_EVIDENCE_QUERIES}
      - EVIDENCE_PER_QUERY=${EVIDENCE_PER_QUERY}
      - SLEEP_BETWEEN_QUERIES=${SLEEP_BETWEEN_QUERIES}

volumes:
  neo4j_data:
