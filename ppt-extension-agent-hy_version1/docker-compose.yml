services:
  # PPT扩展智能体主服务
  ppt-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ppt-extension-agent
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./logs:/app/logs
    depends_on:
      - redis
      - milvus-standalone
    networks:
      - ppt-agent-network
    restart: unless-stopped

  # Redis服务（用于缓存和任务队列）
  redis:
    image: redis:7-alpine
    container_name: ppt-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ppt-agent-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Milvus向量数据库（用于语义检索）
  milvus-standalone:
    image: milvusdb/milvus:v2.3.0
    container_name: ppt-agent-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    depends_on:
      - etcd
      - minio
    networks:
      - ppt-agent-network
    restart: unless-stopped

  # etcd（Milvus依赖）
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: ppt-agent-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - ppt-agent-network
    restart: unless-stopped

  # MinIO（Milvus依赖）
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: ppt-agent-minio
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio-data:/data
    command: minio server /data --console-address ":9001"
    networks:
      - ppt-agent-network
    restart: unless-stopped

volumes:
  redis-data:
  milvus-data:
  etcd-data:
  minio-data:

networks:
  ppt-agent-network:
    driver: bridge
