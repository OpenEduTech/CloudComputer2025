apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: learning-agent
data:
  mongod.conf: |
    storage:
      dbPath: /data/db
      journal:
        enabled: true
    net:
      bindIp: 0.0.0.0
      port: 27017
    replication:
      replSetName: rs0
    security:
      authorization: enabled
      keyFile: /data/keyfile/mongodb-keyfile
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: learning-agent
type: Opaque
stringData:
  mongodb-root-username: root
  mongodb-root-password: example
  mongodb-keyfile: "your_keyfile_content_here"  # 请生成实际的密钥文件内容
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: learning-agent
spec:
  serviceName: mongodb
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        - name: mongodb-config
          mountPath: /etc/mongo
        - name: mongodb-keyfile
          mountPath: /data/keyfile
          readOnly: true
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongodb-root-username
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongodb-root-password
        command:
        - mongod
        - --config
        - /etc/mongo/mongod.conf
      volumes:
      - name: mongodb-config
        configMap:
          name: mongodb-config
      - name: mongodb-keyfile
        secret:
          secretName: mongodb-secret
          items:
          - key: mongodb-keyfile
            path: mongodb-keyfile
            mode: 0400
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: learning-agent
spec:
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: learning-agent
spec:
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
  type: ClusterIP
