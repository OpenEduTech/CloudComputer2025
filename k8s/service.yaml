apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: knowledge-graph
    component: backend
spec:
  selector:
    app: knowledge-graph
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: knowledge-graph
    component: frontend
spec:
  selector:
    app: knowledge-graph
    component: frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  labels:
    app: knowledge-graph
    component: neo4j
spec:
  selector:
    app: knowledge-graph
    component: neo4j
  ports:
    - port: 7474
      targetPort: 7474
      protocol: TCP
      name: http
    - port: 7687
      targetPort: 7687
      protocol: TCP
      name: bolt
  type: ClusterIP
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: knowledge-graph
    component: redis
spec:
  selector:
    app: knowledge-graph
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  type: ClusterIP
