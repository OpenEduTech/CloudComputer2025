apiVersion: v1
kind: ConfigMap
metadata:
  name: learning-agent-config
  namespace: learning-agent
data:
  openai-api-base: "https://open.bigmodel.cn/api/paas/v4"
  mongo-uri: "mongodb://root:example@mongo1:27017,mongo2:27017,mongo3:27017/study_agent_db?replicaSet=rs0&authSource=admin"
  redis-cluster-nodes: "redis1:6379,redis2:6379,redis3:6379,redis4:6379,redis5:6379,redis6:6379"
  log-level: "INFO"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: learning-agent
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        upstream quiz_generator {
            server quiz-generator-service:8001;
        }

        upstream quiz_grader {
            server quiz-grader-service:8002;
        }

        upstream mistake_manager {
            server mistake-manager-service:8003;
        }

        server {
            listen 80;
            server_name localhost;

            client_max_body_size 100M;

            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }

            location /api/generate-exam {
                proxy_pass http://quiz_generator;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/generate-question {
                proxy_pass http://quiz_generator;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/grade-submission {
                proxy_pass http://quiz_grader;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/batch-grade {
                proxy_pass http://quiz_grader;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/mistakes {
                proxy_pass http://mistake_manager;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/weak-points {
                proxy_pass http://mistake_manager;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/review-suggestions {
                proxy_pass http://mistake_manager;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location / {
                proxy_pass http://quiz_generator;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }